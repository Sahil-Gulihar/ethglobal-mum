# Deploys the dashboard and docs to Vercel on every push to main, whoever
# authored the commit.
#
# The Vercel team is on the Hobby plan, which refuses deployments of commits
# whose author is not a team member. This workflow deploys with the project
# owner's token (secret VERCEL_TOKEN) and removes .git before uploading, so
# the Vercel CLI sends no commit metadata and the author check never applies.
#
# Same flow as a manual deploy: run `vercel deploy --prod` from the repo root
# with VERCEL_ORG_ID / VERCEL_PROJECT_ID set; Vercel builds remotely using the
# project's root directory (apps/dashboard or apps/docs) and its env vars.
#
# Both apps deploy on every push. Each app has its own concurrency group that
# cancels older runs, so the newest commit always wins and an older build can
# never finish last and roll production back.
name: Vercel deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Which app to deploy
        type: choice
        options: [both, dashboard, docs]
        default: both

env:
  VERCEL_ORG_ID: team_I7OqraoRbWx1dr2UATrAWDkC

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: dashboard
            project_id: prj_cIaiTGSv9tfa9THRbVn20KSqDFRO
          - app: docs
            project_id: prj_SufyVSa2MTUSHYwOthwYEL3Uk7xu
    concurrency:
      group: vercel-deploy-${{ matrix.app }}
      cancel-in-progress: true
    steps:
      - name: Check manual target
        id: gate
        env:
          TARGET: ${{ inputs.target || 'both' }}
          APP: ${{ matrix.app }}
        run: |
          if [ "$TARGET" = "both" ] || [ "$TARGET" = "$APP" ]; then run=true; else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check app exists on this branch
        id: exists
        if: steps.gate.outputs.run == 'true'
        env:
          APP: ${{ matrix.app }}
        run: |
          if [ -d "apps/$APP" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::apps/$APP is not on this branch yet; skipping"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Strip git metadata
        if: steps.exists.outputs.ok == 'true'
        run: rm -rf .git

      - name: Deploy to production
        if: steps.exists.outputs.ok == 'true'
        env:
          VERCEL_PROJECT_ID: ${{ matrix.project_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          APP: ${{ matrix.app }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Repo secret VERCEL_TOKEN is missing. Create a token at https://vercel.com/account/tokens and run: gh secret set VERCEL_TOKEN -R Sahil-Gulihar/ethglobal-mum"
            exit 1
          fi
          url=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "Deployed $APP (commit by $AUTHOR): $url"
          echo "### $APP deployed: $url" >> "$GITHUB_STEP_SUMMARY"
