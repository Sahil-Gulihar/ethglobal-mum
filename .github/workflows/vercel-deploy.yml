# Deploys the dashboard and docs to Vercel on every push to main, whoever
# authored the commit.
#
# The Vercel team is on the Hobby plan, which refuses deployments of commits
# whose author is not a team member. This workflow deploys with the project
# owner's token (secret VERCEL_TOKEN) and removes .git before uploading, so
# the Vercel CLI sends no commit metadata and the author check never applies.
#
# Same flow as a manual deploy: run `vercel deploy --prod` from the repo root
# with VERCEL_ORG_ID / VERCEL_PROJECT_ID set; Vercel builds remotely using the
# project's root directory (apps/dashboard or apps/docs) and its env vars.
name: Vercel deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Which app to deploy
        type: choice
        options: [both, dashboard, docs]
        default: both

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_I7OqraoRbWx1dr2UATrAWDkC

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      dashboard: ${{ steps.pick.outputs.dashboard }}
      docs: ${{ steps.pick.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$TARGET" != "docs" ] && echo "dashboard=true" >> "$GITHUB_OUTPUT"
            [ "$TARGET" != "dashboard" ] && echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # First push of a branch or a force push: deploy both.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "dashboard=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "$files"
          if echo "$files" | grep -qE '^(apps/dashboard/|packages/|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|vercel\.json|\.vercelignore|\.github/workflows/vercel-deploy\.yml)'; then
            echo "dashboard=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -qE '^(apps/docs/|docs/developers/|packages/|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|\.vercelignore|\.github/workflows/vercel-deploy\.yml)'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: dashboard
            project_id: prj_cIaiTGSv9tfa9THRbVn20KSqDFRO
          - app: docs
            project_id: prj_SufyVSa2MTUSHYwOthwYEL3Uk7xu
    steps:
      - name: Skip if unchanged
        id: gate
        env:
          RUN: ${{ needs.changes.outputs[matrix.app] }}
        run: echo "run=${RUN:-false}" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Strip git metadata
        if: steps.gate.outputs.run == 'true'
        run: rm -rf .git

      - name: Deploy to production
        if: steps.gate.outputs.run == 'true'
        env:
          VERCEL_PROJECT_ID: ${{ matrix.project_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Repo secret VERCEL_TOKEN is missing. Create a token at https://vercel.com/account/tokens and run: gh secret set VERCEL_TOKEN"
            exit 1
          fi
          url=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "Deployed ${{ matrix.app }} (commit by $AUTHOR): $url"
          echo "### ${{ matrix.app }} deployed: $url" >> "$GITHUB_STEP_SUMMARY"
