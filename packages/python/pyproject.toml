[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "whitechain-commerce"
version = "0.1.0"
description = "Server-side Python SDK for Whitechain Commerce"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whitechain_commerce = ["py.typed"]
